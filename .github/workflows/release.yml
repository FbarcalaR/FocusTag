name: Release

# Every merge to main publishes an installable APK on the repository's Releases page.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Cache Robolectric android-all jars
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('gradle/libs.versions.toml', 'app/src/test/resources/robolectric.properties') }}

      - name: Install Android SDK
        run: scripts/setup-android-sdk.sh

      # Optional: with the four FOCUSTAG_* secrets set, every release is signed with the same key,
      # so it installs over the previous one. Without them each release needs an uninstall first.
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.FOCUSTAG_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.FOCUSTAG_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FOCUSTAG_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.FOCUSTAG_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::FOCUSTAG_KEYSTORE_BASE64 is not set; the APK is signed with a throwaway debug key."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/focustag.jks"
          {
            echo "FOCUSTAG_KEYSTORE_FILE=$RUNNER_TEMP/focustag.jks"
            echo "FOCUSTAG_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "FOCUSTAG_KEY_ALIAS=$KEY_ALIAS"
            echo "FOCUSTAG_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Test and build the APK
        run: >
          ./gradlew test assembleDebug
          -Pfocustag.versionCode=${{ github.run_number }}
          -Pfocustag.versionName=$VERSION_NAME

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="focustag-$VERSION_NAME.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$apk"
          gh release create "v$VERSION_NAME" "$apk" \
            --target "$GITHUB_SHA" \
            --title "FocusTag $VERSION_NAME" \
            --generate-notes \
            --latest
